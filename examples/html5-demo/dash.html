<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FastPix Data — DASH.js</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      video { width: 100%; background: #000; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>DASH.js + FastPix Data</h1>
    <p>
      DASH has <strong>no native browser support</strong> — there is no "plain video" DASH
      path. dash.js (MSE) is always required. Pass both the player instance
      (<code>dashPlayer</code>) and the <code>dashjs</code> namespace.
    </p>

    <video id="video-player" controls playsinline></video>

    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <script src="../../dist/index.js"></script>
    <script>
      const video = document.getElementById("video-player");

      // Swap in your own .mpd; using a public DASH test stream here so the example runs end-to-end.
      const src = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd";

      const player = dashjs.MediaPlayer().create();
      player.initialize(video, src, false);

      window.fastpixMetrix.tracker(video, {
        debug: true,
        dashPlayer: player, // instance
        dashjs: dashjs, // namespace -> player_software_name becomes "dash.js Player"
        data: {
          workspace_id: "YOUR_WORKSPACE_KEY",
          player_name: "HTML5 DASH.js Player",
          player_init_time: window.fastpixMetrix.utilityMethods.now(),
          video_title: "Sample (dash.js)",
          video_id: "sample-dashjs",
        },
      });
    </script>
  </body>
</html>
