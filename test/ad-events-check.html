<!doctype html><html><head><meta charset="utf-8"><title>ad events check</title>
<script>
// Logs every FastPix beacon row's event name and the ad fields on it. Open as
// http://localhost:PORT/test/ad-events-check.html?m=ad-midroll (or ad-error,
// ad-list-error, ad-preroll). Used by the headless verification; also handy by hand.
const out=[]; const log=(...a)=>out.push(a.map(x=>typeof x==="string"?x:JSON.stringify(x)).join(" "));
const PICK=["evna","vesqnu","plphti","veisadpn","veadbkid","veadbkps","veadtiof","veaddu","veadasid","veadasix","veadasur","veadbkco","veadatco","veadimco","veadcpco","veaderco","veadsperco","veadbkerco","veadpnti","veadercd","veaderms","vepepy","vepeloti","vewati","verbco","verbdu","veadrbco","veadrbdu","vepyco","veevco","vitp","vectpbti","veadoc","veadbkedrz","veadkpco","veadclco","veadabco","veadtmouco","veadukco","veadrqid","veadrpco"];
const seen=(u,body)=>{ if(!String(u).includes("anlytix")) return; let ev; try{ ev=JSON.parse(body).events; }catch(e){ return; }
  ev.forEach(e=>{ const row={}; PICK.forEach(k=>{ if(e[k]!==undefined) row[k]=e[k]; }); log("ROW", row); }); };
const of=window.fetch; window.fetch=function(u,o){ seen(u,o&&o.body); return of.apply(this,arguments); };
const osb=navigator.sendBeacon.bind(navigator); navigator.sendBeacon=function(u,b){ seen(u,b); return osb(u,b); };
window.addEventListener("error",e=>log("PAGE ERROR",e.message));
setInterval(()=>{const el=document.getElementById("log"); if(el) el.textContent=out.join("\n");},300);
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<script src="../dist/index.js"></script>
</head><body><video id="v" muted playsinline width="320" controls></video><pre id="log"></pre>
<script>
const m=new URLSearchParams(location.search).get("m")||"ad-midroll";
const v=document.getElementById("v");
const hls=new Hls({debug:false});
["INTERSTITIAL_STARTED","INTERSTITIAL_ASSET_STARTED","INTERSTITIAL_ASSET_ENDED","INTERSTITIAL_ASSET_ERROR","ASSET_LIST_LOAD_ERROR","ASSET_LIST_LOAD_TIMEOUT","ASSET_LIST_PARSING_ERROR","INTERSTITIAL_ENDED","INTERSTITIALS_PRIMARY_RESUMED","PLAYOUT_LIMIT_REACHED"].forEach(n=>{ if(Hls.Events[n]) hls.on(Hls.Events[n],()=>log("hls:"+n,"ct="+v.currentTime.toFixed(1))); });
v.addEventListener("playing",()=>log("media:playing ct="+v.currentTime.toFixed(1)));
v.addEventListener("pause",()=>log("media:pause ct="+v.currentTime.toFixed(1)));
// ?src=<full manifest URL> plays any stream instead of a local test manifest;
// ?t=<ms> sets how long the run lasts before the view is closed (default 40 s).
const qs=new URLSearchParams(location.search);
hls.loadSource(qs.get("src")||location.origin+"/test/"+m+".m3u8"); hls.attachMedia(v);
fastpixMetrix.tracker(v,{debug:false,configDomain:"anlytix.dev",hlsjs:hls,Hls,data:{workspace_id:"1081620707349921793",player_name:"ad-events-check",video_title:m,video_id:m}});
// ?delay=<ms> waits that long on the first frame before playing, the way a
// viewer who has not pressed play yet does.
v.addEventListener("loadedmetadata",()=>setTimeout(()=>v.play().catch(e=>log("play rejected",e.message)),Number(qs.get("delay"))||0),{once:true});
// ?skip=<break id>:<seconds> skips that break's first ad once it has played
// for that long, the way a player's skip button does: adskipped is dispatched
// first, then hls.js is told to skip (it has no skip event of its own).
const skipSpec=(qs.get("skip")||"").split(":");
if(skipSpec[0]){ let armed=false; hls.on(Hls.Events.INTERSTITIAL_ASSET_STARTED,(_e,d)=>{ if(armed||d.event.identifier!==skipSpec[0]||d.assetListIndex!==0) return; armed=true; const at=Number(skipSpec[1]||0); const timer=setInterval(()=>{ if((d.player?.currentTime||0)>=at){ clearInterval(timer); log("ui:skip ct="+d.player.currentTime.toFixed(1)); v.fp.dispatch("adskipped"); hls.interstitialsManager.skip(); } },100); }); }
// midroll case: pause 2 s into the ad, resume 2 s later
if(m==="ad-midroll"){ let done=false; hls.on(Hls.Events.INTERSTITIAL_ASSET_STARTED,()=>{ if(done) return; done=true; setTimeout(()=>{ v.pause(); setTimeout(()=>v.play(),2000); },2000); }); }
setTimeout(()=>{ log("END ct="+v.currentTime.toFixed(1)); v.fp && v.fp.destroy(); log("DONE"); },Number(qs.get("t"))||40000);
</script></body></html>
