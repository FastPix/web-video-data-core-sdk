# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker
name: $(Rev:r)

trigger:
- development
- feature/*
- bugfix/*

resources:
- repo: self

variables:
  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Analyze stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: SonarCloudPrepare@4  #NOSONAR
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'sdk_sonar'
        organization: 'fastpix'
        cliProjectKey: 'FastPix_web-hlsplayer-data-sdk'
        projectName: 'web-hlsplayer-data-sdk'
        scannerMode: 'CLI'
        configMode: 'manual'
        extraProperties: |
          sonar.projectKey=FastPix_web-hlsplayer-data-sdk
          sonar.projectName=web-hlsplayer-data-sdk

    - task: SonarCloudAnalyze@4  #NOSONAR
      displayName: 'Run SonarQube Code Analysis'

    - task: SonarCloudPublish@4  #NOSONAR
      displayName: 'Publish SonarQube Quality Gate Results'
      inputs:
        pollingTimeoutSec: '300'
